name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/check-manifests.mjs
      - run: npm install --global @anthropic-ai/claude-code
      - run: claude plugin validate --strict .
      - name: List skills
        if: hashFiles('skills/*/SKILL.md') != ''
        run: npx --yes skills add . --list
